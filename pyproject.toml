[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "proxy-function-gap"
version = "0.2.0"
description = "E0 synthetic checks for fixed-pool proxy-guided selection"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7,<9"]

[project.scripts]
proxy-gap-e0 = "proxy_function_gap.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
